name: map-style
# Без сторонних actions: Node и Python уже есть на ubuntu-24.04.
on:
  push:
    paths:
      - 'map/**'
      - '.github/workflows/map-style.yml'
  pull_request:
    paths:
      - 'map/**'
      - '.github/workflows/map-style.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Код
        run: git clone -q --depth 1 -b "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
      - name: Проверка стиля
        working-directory: repo/map
        run: |
          node --version
          npm ci
          npm run build
          npm test
          python3 -m py_compile scripts/extras.py scripts/places.py scripts/overture.py scripts/landmarks.py
          python3 scripts/test-landmarks.py
          python3 scripts/test-places.py
          git diff --exit-code -- styles sprites/yoobi.json sprites/yoobi@2x.json sprites/yoobi-dark.json sprites/yoobi-dark@2x.json
