# Дополнительные тайлы для стиля Yoobi Map: то, чего нет в схеме OpenMapTiles.
# Собирается Planetiler'ом из той же выгрузки OSM (см. scripts/build-tiles.sh).
#
#   entrance  — подъезды и входы: номер подъезда (ref) и квартиры (flats)
#   tree      — отдельные деревья (natural=tree)
#   tree_row  — ряды деревьев вдоль улиц (natural=tree_row)

schema_name: Yoobi extra
schema_description: Подъезды и деревья из OpenStreetMap для стиля Yoobi Map
attribution: '<a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>'

args:
  area:
    description: Регион Geofabrik
    default: tajikistan

sources:
  osm:
    type: osm
    url: '${ "geofabrik:" + args.area }'

layers:
  - id: entrance
    features:
      - source: osm
        geometry: point
        min_zoom: 14
        include_when:
          entrance: __any__
        attributes:
          - key: entrance
          - key: ref
          - key: flats
            tag_value: addr:flats
  - id: tree
    features:
      - source: osm
        geometry: point
        min_zoom: 14
        include_when:
          natural: tree
  - id: tree_row
    features:
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          natural: tree_row
